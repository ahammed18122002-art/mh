<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>
  <div id="app"></div>

<style id="responsive-zoom-stability">
  /* Responsive layout + browser-zoom compensation */
  html, body {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
  }

  #app {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .wrap {
    width: min(100% - 32px, var(--max));
    margin-inline: auto;
  }

  /* Prevent fixed desktop dimensions from breaking at smaller widths */
  .photo-frame {
    width: clamp(210px, 24vw, 270px);
    height: clamp(275px, 31vw, 350px);
  }

  .terminal-box {
    width: min(90vw, 700px);
    height: min(440px, 78vh);
  }

  @media (max-width: 900px) {
    .wrap { width: min(100% - 28px, var(--max)); }
    .hero { padding-top: 120px; }
  }

  @media (max-width: 600px) {
    .wrap { width: calc(100% - 24px); padding-left: 0; padding-right: 0; }
    .photo-frame {
      width: min(72vw, 270px);
      height: min(92vw, 350px);
    }
    .floating-controls {
      left: 12px;
      bottom: 12px;
      gap: 8px;
    }
    .back-to-top {
      right: 12px;
      bottom: 12px;
    }
  }
</style>

<script>
  (function () {

    (function keepVisualScaleStable() {
      const root = document.documentElement;
      const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (isTouchDevice) return;

      let baseDPR = window.devicePixelRatio || 1;
      let lastZoom = 1;

      function updateZoomCompensation() {
        const currentDPR = window.devicePixelRatio || 1;
        let compensation = baseDPR / currentDPR;

        if (Math.abs(compensation - 1) < 0.015) compensation = 1;
        compensation = Math.min(2, Math.max(0.5, compensation));

        if (Math.abs(compensation - lastZoom) > 0.01) {
          root.style.setProperty('--browser-zoom-compensation', compensation);
          root.style.zoom = compensation;
          lastZoom = compensation;
        }
      }

      window.addEventListener('load', () => {
        baseDPR = window.devicePixelRatio || 1;
        lastZoom = 1;
        root.style.zoom = '1';
      }, { once: true });

      window.addEventListener('resize', updateZoomCompensation, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateZoomCompensation, { passive: true });
      }

      setInterval(updateZoomCompensation, 500);
    })();

    // 1. DYNAMIC ADVANCED CSS INJECTION (GRAY, BLACK, BLUE & YELLOW MIXED THEME)
    const styles = `
      :root{
        --bg-deep: #0a0c10;
        --bg-navy: #111827;
        --bg-navy-card: #1e293b;
        --bg-navy-hover: #334155;
        --navy-accent: #2563eb;
        --navy-light: #38bdf8;
        --border-navy: rgba(56, 189, 248, 0.2);
        --border-subtle: rgba(156, 163, 175, 0.2);
        --yellow: #facc15;
        --yellow-glow: rgba(250, 204, 21, 0.35);
        --text-hi: #f9fafb;
        --text-mid: #9ca3af;
        --text-low: #6b7280;
        --radius: 14px;
        --max: 1180px;
      }
      *{ margin:0; padding:0; box-sizing:border-box; }
      html{ scroll-behavior:smooth; width: 100%; }
      body{
        background-color: var(--bg-deep);
        color: var(--text-hi);
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        line-height: 1.6;
        position: relative;
        width: 100%;
      }

      #scrollProgressBar {
        position: fixed; top: 0; left: 0; height: 3px;
        background: linear-gradient(90deg, var(--navy-accent), var(--yellow));
        width: 0%; z-index: 100000; box-shadow: 0 0 10px var(--yellow);
        transition: width 0.1s ease-out;
      }

      .cursor-dot {
        width: 8px; height: 8px; background: var(--yellow);
        position: fixed; top: 0; left: 0; border-radius: 50%;
        pointer-events: none; z-index: 100002; transform: translate(-50%, -50%);
        box-shadow: 0 0 10px var(--yellow);
      }
      .cursor-ring {
        width: 34px; height: 34px; border: 1.5px solid rgba(250, 204, 21, 0.5);
        position: fixed; top: 0; left: 0; border-radius: 50%;
        pointer-events: none; z-index: 100001; transform: translate(-50%, -50%);
        transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease;
      }
      .cursor-ring.active {
        width: 50px; height: 50px; border-color: var(--yellow);
        background: rgba(250, 204, 21, 0.06);
      }
      @media (max-width: 900px) { .cursor-dot, .cursor-ring { display: none; } }

      #matrixCanvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1; pointer-events: none; opacity: 0.25;
      }
      a{ color:inherit; text-decoration:none; }
      ul{ list-style:none; }
      img{ max-width:100%; display:block; }
      .wrap{ max-width:var(--max); width: 100%; margin:0 auto; padding:0 24px; position: relative; z-index: 1; }
      h1,h2,h3,h4{ font-family:'Sora', sans-serif; }
      ::selection{ background:var(--yellow); color:#0a0c10; }
      a:focus-visible, button:focus-visible{ outline:2px solid var(--yellow); outline-offset:3px; }

      /* SMOOTH SCROLL REVEAL WITHOUT 3D */
      .effect-fade {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .effect-fade.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .eyebrow{
        font-family:'Sora', sans-serif; font-size:0.8rem; letter-spacing:0.12em; text-transform:uppercase;
        color:var(--yellow); margin-bottom:14px; display:inline-flex; align-items:center; gap:8px;
        background: rgba(250, 204, 21, 0.08); padding: 5px 14px; border-radius: 999px; border: 1px solid rgba(250, 204, 21, 0.25);
      }
      .section-title{ font-size:clamp(1.8rem,3.4vw,2.6rem); font-weight:700; margin-bottom:14px; }
      .section-sub{ color:var(--text-mid); max-width:620px; margin-bottom:48px; }
      section{ padding:100px 0; position: relative; width: 100%; }
      @media (max-width:768px){ section{padding:60px 0;} }

      .btn-primary{
        display:inline-flex; align-items:center; gap:9px; padding:10px 20px;
        background: linear-gradient(135deg, #facc15, #eab308); color:#0a0c10; font-weight:700; font-size:0.85rem;
        border-radius:8px; border:none; cursor:pointer; box-shadow:0 0 16px var(--yellow-glow);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5); }

      .btn-secondary{
        display:inline-flex; align-items:center; gap:8px; padding:9px 18px;
        background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-navy);
        color: var(--text-hi); font-weight:600; font-size:0.85rem; border-radius:8px;
        transition: all .2s ease;
      }
      .btn-secondary:hover{ border-color: var(--yellow); color: var(--yellow); background: var(--bg-navy-hover); }

      header.navbar{
        position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important;
        z-index: 99990 !important; padding: 14px 0; background: rgba(10, 12, 16, 0.9);
        backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-navy);
        transition: padding 0.3s ease;
      }
      header.navbar.scrolled{ padding: 10px 0; background: rgba(10, 12, 16, 0.98); }
      .nav-inner{ display:flex; align-items:center; justify-content:space-between; }
      .nav-brand{ display:flex; align-items:center; gap:12px; }
      .nav-brand img{ width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--yellow); }
      .nav-brand .names h1{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.05rem; }
      .nav-brand .names p{ font-size:0.7rem; color:var(--navy-light); font-weight: 500; margin-top:2px; }
      .nav-links{ display:flex; gap:18px; align-items:center; }
      .nav-links a{ font-size:0.84rem; color:var(--text-mid); font-weight:500; white-space:nowrap; transition: color .2s ease; position: relative; }
      .nav-links a::after{
        content:''; position: absolute; bottom:-4px; left:0; width:0%; height:2px;
        background: var(--yellow); transition: width 0.3s ease;
      }
      .nav-links a:hover::after{ width: 100%; }
      .nav-links a:hover{ color:var(--yellow); }
      .nav-toggle{ display:none; background:none; border:none; color:var(--text-hi); font-size:1.3rem; cursor:pointer; }
      @media (max-width:1080px){
        .nav-links{ position:fixed; top:68px; right:0; height:calc(100vh - 68px); width:80%; background:rgba(17, 24, 39, 0.98);
          flex-direction:column; align-items:flex-start; padding:40px 30px; gap:22px; transform:translateX(100%); transition:transform .3s ease; overflow-y:auto; border-left:1px solid var(--border-navy); }
        .nav-links.open{ transform:translateX(0); }
        .nav-toggle{ display:block; }
      }

      .hero{ padding-top:140px; padding-bottom:70px; }
      .hero-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center; }
      @media (max-width:900px){ .hero-grid{ grid-template-columns:1fr; } }
      .hero-badge{ display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border:1px solid var(--border-navy); background: rgba(30, 41, 59, 0.7); border-radius:999px; font-size:0.8rem; margin-bottom:24px; }
      .hero-badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--yellow); animation: pulse 2s infinite; }
      @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(1.2); } }

      /* STYLISH ROLE TAGS WITH FULL COLOR MIXTURE */
      .stylish-title-wrap {
        margin-bottom: 24px;
      }
      .stylish-title-wrap h2 {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        font-size: clamp(0.92rem, 1.8vw, 1.12rem);
        font-weight: 700;
        line-height: 1.6;
      }
      .role-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 10px;
        letter-spacing: 0.02em;
        transition: all 0.25s ease;
      }
      .tag-and {
        color: #64748b;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .tag-cyber {
        background: #111827;
        color: #e2e8f0;
        border: 1px solid #475569;
      }
      .tag-cyber i { color: #94a3b8; }
      .tag-cyber:hover {
        background: #1f2937;
        border-color: #cbd5e1;
        transform: translateY(-2px);
      }
      .tag-pentest {
        background: rgba(250, 204, 21, 0.1);
        color: #facc15;
        border: 1px solid rgba(250, 204, 21, 0.4);
        box-shadow: 0 0 15px rgba(250, 204, 21, 0.15);
      }
      .tag-pentest i { color: #facc15; }
      .tag-pentest:hover {
        background: rgba(250, 204, 21, 0.2);
        border-color: #fde047;
        transform: translateY(-2px);
      }
      .tag-design {
        background: rgba(37, 99, 235, 0.12);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.4);
        box-shadow: 0 0 15px rgba(37, 99, 235, 0.15);
      }
      .tag-design i { color: #38bdf8; }
      .tag-design:hover {
        background: rgba(37, 99, 235, 0.22);
        border-color: #93c5fd;
        transform: translateY(-2px);
      }
      .tag-osint {
        background: rgba(45, 212, 191, 0.1);
        color: #2dd4bf;
        border: 1px solid rgba(45, 212, 191, 0.4);
        box-shadow: 0 0 15px rgba(45, 212, 191, 0.15);
      }
      .tag-osint i { color: #5eead4; }
      .tag-osint:hover {
        background: rgba(45, 212, 191, 0.2);
        border-color: #99f6e4;
        transform: translateY(-2px);
      }

      .hero p.lede{ color:var(--text-mid); max-width:520px; margin-bottom:30px; font-size:1rem; min-height: 3.2em; }
      .hero-stats{ display:flex; gap:30px; flex-wrap:wrap; align-items:center; }
      .hero-stats div .num{ font-family:'Sora',sans-serif; font-size:1.75rem; font-weight:700; color:var(--yellow); }
      .hero-stats div .label{ font-size:0.75rem; color:var(--text-low); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
      .hero-socials{ display:flex; flex-direction:column; justify-content:center; }
      .hero-social-icons{ display:flex; gap:9px; margin-top:4px; }
      .hero-social-link{
        width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
        background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-navy); color: var(--text-mid);
        font-size: 0.95rem; transition: all 0.2s ease;
      }
      .hero-social-link:hover{
        color: #0a0c10; background: var(--yellow); border-color: var(--yellow);
        transform: translateY(-2px);
      }

      /* AUTOMATIC SLOW UP-DOWN FLOATING ANIMATION */
      @keyframes autoUpDown {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
        100% { transform: translateY(0px); }
      }

      .hero-visual{
        position:relative; display:flex; justify-content:center; align-items:center;
        animation: autoUpDown 5s ease-in-out infinite;
      }
      .photo-frame{
        border-radius:18px; overflow:hidden; position:relative; z-index:2;
        border:2px solid var(--yellow); box-shadow:0 0 35px var(--yellow-glow), 0 15px 30px rgba(0,0,0,0.6);
        background: #111827;
      }
      .photo-frame img{ width:100%; height:100%; object-fit:cover; object-position:center; }

      .tilt-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(17, 24, 39, 0.9));
        border: 1px solid var(--border-navy); border-radius: var(--radius);
        position: relative; overflow: hidden;
        transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      }
      .tilt-card:hover {
        border-color: var(--yellow);
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--yellow-glow);
      }

      .research-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
      @media (max-width:860px){ .research-grid{ grid-template-columns:1fr; } }
      .paper-card{ padding:30px; display:flex; flex-direction:column; justify-content:space-between; }
      .paper-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px; }
      .paper-tag{
        font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
        color:var(--yellow); background:rgba(250, 204, 21, 0.1); border:1px solid rgba(250, 204, 21, 0.25);
        padding:4px 10px; border-radius:6px;
      }
      .paper-year{ font-size:0.85rem; color:var(--text-low); font-weight:600; }
      .paper-card h3{ font-size:1.15rem; margin-bottom:12px; line-height:1.4; color:var(--text-hi); }
      .paper-authors{ font-size:0.84rem; color:var(--navy-light); margin-bottom:14px; }
      .paper-desc{ font-size:0.9rem; color:var(--text-mid); margin-bottom:24px; line-height:1.6; }
      .paper-links{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:auto; }

      .projects-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
      @media (max-width:960px){ .projects-grid{ grid-template-columns:repeat(2,1fr); } }
      @media (max-width:600px){ .projects-grid{ grid-template-columns:1fr; } }
      .project-card{ padding:26px; display:flex; flex-direction:column; }
      .project-icon{ font-size:1.6rem; margin-bottom:16px; color:var(--yellow); }
      .project-card h3{ font-size:1.05rem; margin-bottom:10px; }
      .project-card p{ font-size:0.88rem; color:var(--text-mid); margin-bottom:18px; }
      .project-repo-link{ margin-top:auto; font-size:0.82rem; color:var(--yellow); font-weight:600; display:inline-flex; align-items:center; gap:6px; }
      .project-repo-link:hover{ text-decoration:underline; }

      .about-grid{ display:grid; grid-template-columns:1.3fr 0.7fr; gap:40px; align-items:start; }
      @media (max-width:900px){ .about-grid{ grid-template-columns:1fr; } }
      .about-content p{ color:var(--text-mid); margin-bottom:18px; max-width:600px; font-size: 0.95rem; }
      .about-content p.intro{ color:var(--text-hi); font-weight:600; font-size:1.05rem; border-left: 3px solid var(--yellow); padding-left: 14px; }
      .about-cards{ display:flex; flex-direction:column; gap:18px; }
      .about-card{ padding:24px; }
      .about-card h4{ font-size:1rem; margin-bottom:14px; display:flex; align-items:center; gap:10px; color:var(--yellow); }
      .about-card ul{ display:flex; flex-direction:column; gap:10px; }
      .about-card li{ font-size:0.88rem; color:var(--text-mid); padding-left:16px; position:relative; }
      .about-card li::before{ content:'—'; position:absolute; left:0; color:var(--yellow); }

      .service-img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 16px;
        border: 1px solid var(--border-navy);
        transition: border-color 0.25s ease;
      }
      .service-img:hover {
        border-color: var(--yellow);
      }

      .skills-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
      @media (max-width:700px){ .skills-grid{ grid-template-columns:1fr; } }
      .skill-group{ padding:24px; }
      .skill-group h4{ font-size:0.98rem; margin-bottom:18px; display:flex; align-items:center; gap:10px; color:var(--yellow); }
      .skill-tags{ display:flex; flex-wrap:wrap; gap:8px; }
      .skill-tag{
        font-size:0.8rem; padding:6px 13px; border-radius:999px;
        background: rgba(30, 41, 59, 0.6); border:1px solid var(--border-navy);
        color:var(--text-mid); transition: all .2s ease;
      }
      .skill-tag:hover{ border-color:var(--yellow); color:var(--yellow); }

      .trust-visual{ position:relative; width:100%; max-width:460px; margin:0 auto; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
      .trust-photo{
        width:220px; height:220px; border-radius:50%; overflow:hidden;
        border:3px solid var(--yellow); box-shadow:0 0 30px var(--yellow-glow); z-index:2;
        animation: autoUpDown 4.5s ease-in-out infinite;
      }
      .trust-photo img{ width:100%; height:100%; object-fit:cover; object-position:center; }
      .trust-chip{
        position:absolute; background:rgba(30, 41, 59, 0.95);
        border:1px solid var(--border-navy); border-radius:999px; padding:9px 16px;
        font-size:0.8rem; font-weight:600; white-space:nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      .trust-chip .num{ color:var(--yellow); font-weight:700; }
      .trust-chip.c1{ top:2%; left:0%; } .trust-chip.c2{ top:8%; right:-4%; } .trust-chip.c3{ bottom:10%; left:-6%; }
      .trust-chip.c4{ bottom:4%; right:2%; } .trust-chip.c5{ bottom:-6%; left:50%; transform:translateX(-50%); }
      @media (max-width:520px){ .trust-chip{ font-size:0.68rem; padding:6px 10px; } .trust-photo{ width:160px; height:160px; } }

      .test-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
      @media (max-width:900px){ .test-grid{ grid-template-columns:repeat(2,1fr); } }
      @media (max-width:520px){ .test-grid{ grid-template-columns:1fr; } }
      .test-card{
        aspect-ratio:9/13; border-radius:var(--radius); overflow:hidden; position:relative;
        border:1px solid var(--border-navy); transition: transform .3s ease, border-color .3s ease;
      }
      .test-card:hover{ transform: translateY(-4px); border-color:var(--yellow); }
      .test-card img{ width:100%; height:100%; object-fit:cover; }

      .achievements-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      @media (max-width: 960px) { .achievements-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 640px) { .achievements-grid { grid-template-columns: 1fr; } }
      .achievement-card { overflow: hidden; display: flex; flex-direction: column; }
      .achievement-media { width: 100%; height: 210px; overflow: hidden; border-bottom: 1px solid var(--border-navy); }
      .achievement-media img { width: 100%; height: 100%; object-fit: cover; }
      .achievement-body { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
      .achievement-badge {
        display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--yellow); background: rgba(250, 204, 21, 0.1);
        padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; width: fit-content;
      }
      .achievement-body h3 { font-size: 1.1rem; margin-bottom: 10px; color: var(--text-hi); }
      .achievement-body p { font-size: 0.88rem; color: var(--text-mid); line-height: 1.6; }

      .timeline{ position:relative; padding-left:36px; }
      .timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--yellow), var(--navy-accent), transparent); }
      .tl-item{ position:relative; margin-bottom:36px; }
      .tl-item::before{
        content:''; position:absolute; left:-36px; top:4px; width:12px; height:12px;

    // 3. SYNTHETIC AUDIO ENGINE
    let audioEnabled = true;
    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.05, type = 'sine', gainVal = 0.04) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const soundToggleBtn = document.getElementById('soundToggleBtn');

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const chars = '01ABCDEF{}:<>/*#[]=+-~_010101XYZ$';
    const fontSize = 14;
    let columns = Math.floor(width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10, 12, 16, 0.08)';
      ctx.fillRect(0, 0, width, height);
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        let x = i * fontSize;
        let y = drops[i] * fontSize;
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillStyle = Math.random() > 0.97 ? '#facc15' : '#475569';
        ctx.fillText(text, x, y);

        if (drops[i] * fontSize > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 45);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops = Array(columns).fill(1);
    });

          termBody.appendChild(out);

          gameState.currentQ++;
          if (gameState.currentQ < quizData.length) {
            const nextQ = document.createElement('p');
            nextQ.style.color = '#38bdf8';
            nextQ.innerHTML = `<br>${quizData[gameState.currentQ].q}`;
            termBody.appendChild(nextQ);
          } else {
            const fin = document.createElement('p');
            fin.style.color = 'var(--yellow)';
            fin.innerHTML = `<br><strong>*** MISSION COMPLETE ***</strong><br>Clearance Score: ${gameState.score} / ${quizData.length}`;
            termBody.appendChild(fin);
            gameState.active = false;
          }
          termBody.scrollTop = termBody.scrollHeight;
          return;
        }

        if (cmd === 'help') {
          out.innerHTML = `Available commands: <br>
          • <span style="color:var(--yellow)">[Any Question]</span> — Direct chat with Gemini AI<br>
          • <span style="color:var(--yellow)">setkey &lt;key&gt;</span> — Set your Gemini API Key<br>
          • <span style="color:var(--yellow)">game</span> — Start Cyber Security Trivia<br>
          • <span style="color:var(--yellow)">about</span> — Profile summary<br>
          • <span style="color:var(--yellow)">research</span> — View papers<br>
          • <span style="color:var(--yellow)">skills</span> — Technical stack<br>
          • <span style="color:var(--yellow)">clear</span> — Clear terminal<br>
          • <span style="color:var(--yellow)">exit</span> — Close window`;
          termBody.appendChild(out);
          termBody.scrollTop = termBody.scrollHeight;
          return;
        } else if (cmd === 'game') {
          gameState.active = true;
          gameState.currentQ = 0;
          gameState.score = 0;
          playBeep(750, 0.06, 'triangle', 0.05);
          out.innerHTML = `<span style="color:var(--yellow); font-weight:bold;">[=== INITIALIZING TRIVIA PROTOCOL ===]</span><br>
          Answer correctly to advance:<br><br>
          <span style="color:#38bdf8">${quizData[0].q}</span>`;
          termBody.appendChild(out);
          termBody.scrollTop = termBody.scrollHeight;
          return;
        } else if (cmd === 'about') {
          out.innerText = "MD. Ahammed: Cybersecurity Researcher & Application Pentester with 3+ years in vulnerability mitigation.";
          termBody.appendChild(out);
          termBody.scrollTop = termBody.scrollHeight;
          return;
        } else if (cmd === 'research') {
          out.innerText = "1. CMS Malware AST Signature Detection (IEEE 2025)\n2. Parameter Pollution in Next-Gen WAFs (arXiv 2024)";
          termBody.appendChild(out);
          termBody.scrollTop = termBody.scrollHeight;
          return;
        } else if (cmd === 'skills') {
          out.innerText = "Burp Suite Pro, AST Analysis, OWASP Top 10, Python, PHP, Linux Hardening, SQLi Mitigation.";
          termBody.appendChild(out);
          termBody.scrollTop = termBody.scrollHeight;
          return;
        } else if (cmd === 'clear') {
          termBody.innerHTML = '';
          return;
        } else if (cmd === 'exit') {
          toggleTerminal();
          return;
        }

        out.innerHTML = `<span style="color:#38bdf8;"><i class="fa-solid fa-spinner fa-spin"></i> Querying Gemini Neural Core...</span>`;
        termBody.appendChild(out);
        termBody.scrollTop = termBody.scrollHeight;

        const aiResponse = await askGeminiDirect(rawCmd);
        playBeep(780, 0.06, 'triangle', 0.04);
        out.innerHTML = `<span style="color:#38bdf8; font-weight:bold;">[Gemini]:</span> ${aiResponse}`;
        termBody.scrollTop = termBody.scrollHeight;
      }
    });

    // 9. SCROLL REVEAL OBSERVER
    const scrollElements = document.querySelectorAll('.effect-fade');
    const scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -30px 0px' });
    scrollElements.forEach(el => scrollObserver.observe(el));

    // 10. NUMBER COUNTER ANIMATION
    const counters = document.querySelectorAll('.num[data-count]');
    const counterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        const target = parseInt(el.dataset.count, 10);
        const suffix = el.dataset.suffix || '';
        const duration = 1400;
        const startTime = performance.now();
        const isCommaFormat = target >= 1000;
        const tick = (now) => {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.floor(eased * target);
          el.textContent = (isCommaFormat ? current.toLocaleString('en-US') : current) + suffix;
          if (progress < 1) requestAnimationFrame(tick);
          else el.textContent = (isCommaFormat ? target.toLocaleString('en-US') : target) + suffix;
        };
        requestAnimationFrame(tick);
        counterObserver.unobserve(el);
      });
    }, { threshold: 0.4 });
    counters.forEach(c => counterObserver.observe(c));

    // 11. NAVBAR & BACK TO TOP
    const navbar = document.getElementById('navbar');
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 30);
      backToTop.classList.toggle('show', window.scrollY > 450);
    });

    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 12. TAWK.TO EMBED INTEGRATION
    window.Tawk_API = window.Tawk_API || {};
    window.Tawk_API.customStyle = { zIndex: 99992 };
    (function () {
      const s1 = document.createElement("script");
      const s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = 'https://embed.tawk.to/YOUR_PROPERTY_ID/YOUR_WIDGET_ID';
      s1.charset = 'UTF-8';
      s1.setAttribute('crossorigin', '*');
      s0.parentNode.insertBefore(s1, s0);
    })();
  })();
  </script>
